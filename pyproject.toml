[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-os"
version = "0.1.0"
description = "Auditable, factor-first quantitative strategy workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
quant-strategy = "research.strategy_workspace.cli:main"

[project.optional-dependencies]
market-baostock = ["baostock"]
market-tushare = ["tushare"]
market-akshare = ["akshare"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "integrations*", "research*", "trading*"]
namespaces = true
